<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="200"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shield" cx="50%" cy="50%" r="50%">
      <stop offset="0.62" stop-color="#FF9A1F" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#FF9A1F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD080" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#000"/>
    <g fill="#7A4A10">
      <circle cx="120" cy="140" r="4"/><circle cx="900" cy="110" r="5"/><circle cx="80" cy="610" r="3"/>
      <circle cx="950" cy="520" r="4"/><circle cx="180" cy="930" r="4"/><circle cx="880" cy="900" r="3"/>
      <circle cx="300" cy="60" r="3"/><circle cx="760" cy="980" r="3"/><circle cx="40" cy="380" r="3"/>
    </g>
    <!-- shields -->
    <ellipse cx="512" cy="512" rx="372" ry="450" fill="url(#shield)"/>
    <ellipse cx="512" cy="512" rx="372" ry="450" fill="none" stroke="#FF9A1F" stroke-width="10" stroke-dasharray="46 22" filter="url(#glow)" opacity="0.9"/>
    <!-- ship, saucer to the top -->
    <g fill="#2A1A06" stroke="#FF9A1F" stroke-width="14" stroke-linejoin="round" filter="url(#glow)">
      <!-- pylons -->
      <path d="M492 700 L340 610 L340 650 L492 740 Z"/>
      <path d="M532 700 L684 610 L684 650 L532 740 Z"/>
      <!-- nacelles -->
      <rect x="306" y="540" width="68" height="370" rx="34"/>
      <rect x="650" y="540" width="68" height="370" rx="34"/>
      <!-- neck -->
      <path d="M484 470 L540 470 L530 600 L494 600 Z"/>
      <!-- engineering hull -->
      <ellipse cx="512" cy="720" rx="56" ry="150"/>
      <!-- saucer -->
      <circle cx="512" cy="300" r="210"/>
    </g>
    <g fill="none" stroke="#FFD080" stroke-width="7" opacity="0.85">
      <circle cx="512" cy="300" r="130"/>
      <circle cx="512" cy="300" r="46" fill="#FF9A1F" fill-opacity="0.35"/>
      <circle cx="340" cy="574" r="18" fill="#FFD080" fill-opacity="0.6"/>
      <circle cx="684" cy="574" r="18" fill="#FFD080" fill-opacity="0.6"/>
      <circle cx="512" cy="600" r="16" fill="#FFD080" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
